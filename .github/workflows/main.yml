name: Docker CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: List Files
        run: ls -R

      - name: Build Docker Image
        run: docker build -t my-nginx-app ./docker-nginx-project
