name: Docker CI Pipeline

on:
  push:
    branches:
      - main
      - multi-container
      - reverse-proxy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t my-nginx-app .name: Docker CI Pipeline

