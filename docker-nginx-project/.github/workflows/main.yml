name: Docker CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: List Repository Files
        run: ls -R

      - name: Build Docker Image
        run: docker build -t my-nginx-app .

      - name: Run Docker Container
        run: docker run -d -p 8080:80 --name test-container my-nginx-app

      - name: Wait for Container Startup
        run: sleep 5

      - name: Test Application
        run: curl http://localhost:8080

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Docker Image
        run: docker tag my-nginx-app ${{ secrets.DOCKER_USERNAME }}/my-nginx-app:latest

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my-nginx-app:latest
